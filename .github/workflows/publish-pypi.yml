# Publish a GitHub release's artifacts to PyPI via Trusted Publishing (OIDC).
#
# No API token is stored anywhere: PyPI trusts this exact repository + workflow
# + environment, configured once at
#   https://pypi.org/manage/project/avera-gate/settings/publishing/
#   owner: mikheil-galoian · repository: avera · workflow: publish-pypi.yml
#   environment: pypi
#
# It uploads exactly the wheel and sdist attached to the GitHub release, not a
# fresh build, so the files on PyPI have the SHA-256 published in the release
# notes. It refuses to publish if the artifact version does not match the tag.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/avera-gate/
    permissions:
      contents: read
      id-token: write   # OIDC token for PyPI Trusted Publishing
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          sha256sum dist/*

      - name: Check artifacts match the tag
        run: |
          version="${TAG#v}"
          wheels=(dist/*-"$version"-*.whl)
          sdists=(dist/*-"$version".tar.gz)
          count=$(ls dist | wc -l)
          if [ "$count" -ne 2 ] || [ ! -f "${wheels[0]}" ] || [ ! -f "${sdists[0]}" ]; then
            echo "::error::expected exactly one wheel and one sdist for version $version"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate metadata
        run: |
          python -m pip install --quiet twine
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
