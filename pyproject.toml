[project]
# Distribution name is "avera-gate": the name "avera" was already taken on PyPI
# (an unrelated 2023 stub package). The import package and the CLI command are
# both still "avera" — only `pip install` differs.
name = "avera-gate"
version = "0.1.1"
description = "Deterministic regression gate for CI: proves which tests a change broke. Zero dependencies, no LLM in the decision."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AVERA Engineering", email = "mgaloyan79@gmail.com" }
]
keywords = [
    "ci",
    "continuous-integration",
    "regression-testing",
    "test-automation",
    "junit",
    "pytest",
    "github-actions",
    "code-review",
    "ai-agents",
    "pull-request",
    "quality-gate",
    "functional-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/mikheil-galoian/avera"
Documentation = "https://github.com/mikheil-galoian/avera/blob/main/README.md"
Repository = "https://github.com/mikheil-galoian/avera"
"Bug Tracker" = "https://github.com/mikheil-galoian/avera/issues"

[project.scripts]
avera = "avera.__main__:main"
avera-api = "avera_api.main:main"

[project.optional-dependencies]
demo = ["streamlit>=1.44,<2"]
dev = ["pytest>=8.0", "pytest-subtests>=0.11", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the built-in gate policies inside the wheel. Without this, `avera check`
# raises PolicyError on any machine that does not have a source checkout.
"avera.gates" = ["policies/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
